name: Migration Check

on:
  push:
    paths:
      - 'packages/db/**'
  pull_request:
    paths:
      - 'packages/db/**'

jobs:
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      # ADR-047 K5.2 — 073+ migrations must carry a rollback-compat label.
      # ADR-049 K3/K5.1 — section-marker ban + breaking ↔ migrations-down/ pairing.
      - name: Check rollback-compat labels
        run: pnpm --filter @restoran-pos/db check:rollback-compat

      - name: Run migrations
        run: pnpm --filter @restoran-pos/db migrate

      - name: Codegen
        run: pnpm --filter @restoran-pos/db codegen

      - name: Verify generated.ts is up to date
        run: git diff --exit-code packages/db/src/generated.ts

      # ADR-049 K5.2 — every migrations-down/ file: up → down → up on a throw-away DB,
      # catalog snapshot before == after down. Real files first (0 cases today), then the
      # synthetic fixture as positive control and a deliberately wrong down as negative control.
      - name: Down round-trip (real down files)
        run: pnpm --filter @restoran-pos/db check:down-roundtrip

      - name: Down round-trip — positive control (fixture must pass)
        run: |
          pnpm --filter @restoran-pos/db check:down-roundtrip src/__fixtures__/down-roundtrip/good | tee good.log
          grep -q "1 vaka · 0 hatalı" good.log   # a wrong fixture path would give 0 cases and stay green

      - name: Down round-trip — negative control (wrong down must fail for the right reason)
        run: |
          set +e
          pnpm --filter @restoran-pos/db check:down-roundtrip src/__fixtures__/down-roundtrip/bad > bad.log 2>&1
          rc=$?
          set -e
          cat bad.log
          test "$rc" -ne 0
          grep -q "down sonrası şema migration öncesinden farklı" bad.log
          grep -q "rt_fixture.note" bad.log
